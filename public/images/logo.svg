<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Logo Sedap Rasa Nusantara">
    <defs>
        <linearGradient id="bgCream" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFF9F0"/>
            <stop offset="100%" stop-color="#FDE6C4"/>
        </linearGradient>
        <linearGradient id="ringSpice" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#C81E1E"/>
            <stop offset="55%" stop-color="#EA580C"/>
            <stop offset="100%" stop-color="#F59E0B"/>
        </linearGradient>
        <linearGradient id="chiliBody" x1="15%" y1="10%" x2="85%" y2="95%">
            <stop offset="0%" stop-color="#F97316"/>
            <stop offset="45%" stop-color="#DC2626"/>
            <stop offset="100%" stop-color="#881313"/>
        </linearGradient>
        <linearGradient id="chiliFlame" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#EA580C"/>
            <stop offset="100%" stop-color="#FDBA74"/>
        </linearGradient>
    </defs>

    <!-- Outer Badge -->
    <circle cx="60" cy="60" r="56" fill="url(#ringSpice)"/>
    <circle cx="60" cy="60" r="50" fill="url(#bgCream)"/>
    <circle cx="60" cy="60" r="46" fill="none" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.55"/>

    <!-- Warm Flame / Spice Aura Behind Chili -->
    <path d="M59 18 C72 28, 86 42, 82 62 C79 75, 67 84, 54 84 C65 76, 70 63, 66 50 C63 40, 58 31, 59 18 Z"
          fill="url(#chiliFlame)" opacity="0.28"/>

    <!-- Chili Stem & Calyx (Warm Orange-Red-Cream Palette) -->
    <path d="M74 22 C80 16, 89 16, 94 21 C90 22, 84 22, 79 27 Z"
          fill="#9A3412"/>
    <path d="M68 29 C71 23, 78 23, 83 28 C80 32, 74 33, 68 31 Z"
          fill="#C2410C"/>

    <!-- Main Curved Chili Pepper -->
    <path d="M71 28
             C81 33, 86 46, 81 61
             C75 79, 58 93, 35 97
             C29 98, 25 94, 28 89
             C38 77, 50 67, 55 52
             C59 40, 59 31, 67 28 Z"
          fill="url(#chiliBody)"/>

    <!-- Glossy Cream Highlight on Chili -->
    <path d="M67 35 C73 41, 74 52, 69 63 C65 72, 57 80, 48 85"
          fill="none" stroke="#FFF4E6" stroke-width="3.5" stroke-linecap="round" opacity="0.72"/>

    <!-- Secondary Small Spice Drop / Seed Accent -->
    <circle cx="38" cy="44" r="3.5" fill="#F97316" opacity="0.85"/>
    <circle cx="32" cy="54" r="2.2" fill="#DC2626" opacity="0.75"/>
    <circle cx="46" cy="36" r="2" fill="#EA580C" opacity="0.7"/>

    <!-- Subtle Bottom Spice Ribbon Arc -->
    <path d="M31 101 Q60 110 89 101" fill="none" stroke="#C81E1E" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
</svg>
